name: Build Android APK & OTA Bundle

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'remote-config.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Inject Encrypted GitHub Secret for APK Build
        env:
          SECRET_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node -e '
            const k = process.env.SECRET_KEY || "";
            const bytes = Array.from(k).map((c, i) => c.charCodeAt(0) ^ ((i * 7 + 42) & 0xff));
            const fs = require("fs");
            fs.writeFileSync("src/config.js", `const _b = ${JSON.stringify(bytes)};\nexport const APP_CONFIG = {\n  get GEMINI_API_KEY() { return _b.map((b, i) => String.fromCharCode(b ^ ((i * 7 + 42) & 0xff))).join(""); },\n  DEFAULT_USER: "Omar"\n};\n`);
          '

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Inject OTA Dynamic Bundle Loader into MainApplication.kt
        run: |
          node -e '
            const fs = require("fs");
            const f = "android/app/src/main/java/com/omar/auraai/MainApplication.kt";
            let content = fs.readFileSync(f, "utf8");
            if (!content.includes("getJSBundleFile")) {
              const hook = `
          override fun getJSBundleFile(): String? {
            val otaFile = java.io.File(applicationContext.filesDir, "ota/index.android.bundle")
            if (otaFile.exists()) {
              return otaFile.absolutePath
            }
            return super.getJSBundleFile()
          }
`;
              content = content.replace("override fun getJSMainModuleName(): String = \".expo/.virtual-metro-entry\"", hook + "          override fun getJSMainModuleName(): String = \".expo/.virtual-metro-entry\"");
              fs.writeFileSync(f, content, "utf8");
              console.log("Injected OTA getJSBundleFile hook into MainApplication.kt");
            }
          '

      - name: Generate OTA JavaScript Bundle
        run: |
          npx expo export:embed --platform android --dev false --entry-file index.js --bundle-output index.android.bundle --assets-dest ota-assets

      - name: Enable Cleartext LAN Traffic & Build Release APK
        working-directory: ./android
        run: |
          node -e '
            const fs = require("fs");
            const mf = "app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(mf, "utf8");
            if (!xml.includes("usesCleartextTraffic")) {
              xml = xml.replace("<application", "<application android:usesCleartextTraffic=\"true\"");
              fs.writeFileSync(mf, xml, "utf8");
            }
          '
          sed -i "s/classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')/classpath('org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25')/g" build.gradle
          chmod +x gradlew
          ./gradlew assembleRelease -Pandroid.kotlinVersion=1.9.25 --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Namikaze-AI.apk
          cp android/app/build/outputs/apk/release/app-release.apk Aura-AI.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Namikaze-AI-APK
          path: Namikaze-AI.apk

      - name: Publish APK & OTA Bundle to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1.0
          name: "Namikaze AI v3.1.0 (Android APK & In-App OTA)"
          body: "Namikaze AI v3.1.0: Uygulama içi tek dokunuşla güncelleme (OTA & Doğrudan APK İndirici) ve çift katmanlı laptop köprüsü."
          files: |
            Namikaze-AI.apk
            Aura-AI.apk
            index.android.bundle
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
