name: Build Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'remote-config.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Inject Encrypted GitHub Secret for APK Build
        env:
          SECRET_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node -e '
            const k = process.env.SECRET_KEY || "";
            const bytes = Array.from(k).map((c, i) => c.charCodeAt(0) ^ ((i * 7 + 42) & 0xff));
            const fs = require("fs");
            fs.writeFileSync("src/config.js", `const _b = ${JSON.stringify(bytes)};\nexport const APP_CONFIG = {\n  get GEMINI_API_KEY() { return _b.map((b, i) => String.fromCharCode(b ^ ((i * 7 + 42) & 0xff))).join(""); },\n  DEFAULT_USER: "Dostum"\n};\n`);
          '

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build Release APK
        working-directory: ./android
        run: |
          sed -i "s/classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')/classpath('org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25')/g" build.gradle
          chmod +x gradlew
          ./gradlew assembleRelease -Pandroid.kotlinVersion=1.9.25 --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Aura-AI.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aura-AI-APK
          path: Aura-AI.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Aura AI v1.0.0 (Android APK)"
          body: "Android telefonunuza doğrudan indirip kurabileceğiniz tam sürüm **Aura-AI.apk** dosyası."
          files: Aura-AI.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
